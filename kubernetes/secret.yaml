# LAB CREDENTIALS ONLY.
#
# WARNING: stringData is plain text in this file and only base64-encoded (NOT encrypted)
# once stored in etcd. These values are the same throwaway ones already committed in
# .env.example and application.properties, so the lab is reproducible out of the box.
# Never put a real password here, and never commit a modified copy of this file.
#
# The application reuses MYSQL_USER / MYSQL_PASSWORD as its JDBC credentials and
# RABBITMQ_USER / RABBITMQ_PASSWORD as its AMQP credentials -- see app-deployment.yaml,
# which maps these five keys onto the env var names the WAR expects. Keeping one copy of
# each credential means MySQL and the app can never drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: vprofile-secret
  namespace: vprofile
  labels:
    app.kubernetes.io/part-of: vprofile
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: admin123
  MYSQL_USER: admin
  MYSQL_PASSWORD: admin123
  RABBITMQ_USER: test
  RABBITMQ_PASSWORD: test
