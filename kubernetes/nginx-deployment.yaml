# nginx -- the public entry point, mirroring the repository's own vagrant/*/nginx.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-nginx
  namespace: vprofile
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: vprofile
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: vprofile
      annotations:
        # Forces a rollout when the config changes; without it, editing the ConfigMap
        # updates the mounted file but never reloads nginx. Update this value (or run
        # `kubectl rollout restart`) after changing nginx-configmap.yaml.
        vprofile.lab/config-revision: "1"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # subPath so the mount replaces only default.conf and leaves the rest of
            # /etc/nginx/conf.d intact.
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          # Both probes hit nginx's own health location, never the upstream: nginx must stay
          # up and serve a 502 when the app is down, not be restarted because of it.
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: vprofile-nginx-config
