# Every value below uses ${ENV_VAR:default} so containers can inject configuration
# without rebuilding the WAR. Resolution is handled by the PropertySourcesPlaceholderConfigurer
# registered by <context:property-placeholder> in WEB-INF/appconfig-root.xml, which consults
# system properties and environment variables before this file. The defaults are the original
# Vagrant-lab values, so running outside a container is unchanged.

#JDBC Configutation for Database Connection
jdbc.driverClassName=${JDBC_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
jdbc.url=${JDBC_URL:jdbc:mysql://db01:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull}
jdbc.username=${JDBC_USERNAME:admin}
jdbc.password=${JDBC_PASSWORD:admin123}

#Memcached Configuration For Active and StandBy Host
#For Active Host
memcached.active.host=${MEMCACHED_HOST:mc01}
memcached.active.port=${MEMCACHED_PORT:11211}
#For StandBy Host
memcached.standBy.host=${MEMCACHED_STANDBY_HOST:127.0.0.2}
memcached.standBy.port=${MEMCACHED_STANDBY_PORT:11211}

#RabbitMq Configuration
rabbitmq.address=${RABBITMQ_HOST:rmq01}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USERNAME:test}
rabbitmq.password=${RABBITMQ_PASSWORD:test}

#Elasticesearch Configuration
# Elasticsearch is NOT part of the container lab: the RestHighLevelClient is built per-request
# by the static ElasticsearchUtil.getRestHighLevelClient(), only from ElasticSearchController,
# and nothing constructs it at startup. These four keys must still be present, because
# beans/Components.java declares @Value("${elasticsearch.*}") with no defaults and the
# placeholder configurer is not ignore-unresolvable -- removing them breaks context startup.
# Default port corrected 9300 -> 9200: the code builds an HTTP REST client, and 9300 is the
# transport port (elasticeSearchRes.jsp itself documents 9200).
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.cluster=${ELASTICSEARCH_CLUSTER:vprofile}
elasticsearch.node=${ELASTICSEARCH_NODE:vprofilenode}


spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB

logging.level.org.springframework.security=DEBUG


# application.properties
spring.security.user.name=admin_vp
spring.security.user.password=admin_vp
spring.security.user.roles=ADMIN


spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#logging.level.root=OFF
#logging.level.org.springframework.web=OFF
#spring.main.banner-mode=OFF

# Hibernate SQL Queries
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF


# Debug Logging for SecurityServiceImpl
logging.level.com.visualpathit.account.service.SecurityServiceImpl=OFF


