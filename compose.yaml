# vprofile container lab.
#
#   docker compose build --no-cache app
#   docker compose up -d
#   open http://localhost/
#
# See docs/container-lab.md for the full guide. No top-level `version:` -- it is obsolete in
# the Compose Specification.
#
# Elasticsearch is intentionally absent: ElasticSearchController builds its RestHighLevelClient
# per request via a static factory, no bean constructs one at startup, and the feature is not
# reachable from the UI (welcome.jsp links it as href="#"). See docs/container-lab.md.

# --- shared fragments -------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------------
  # Application -- Tomcat 10.1 serving ROOT.war built from this repository.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Local tag only, and only alongside build:. No prebuilt vprofile image is ever pulled.
    image: ${APP_IMAGE_TAG:-vprofile-app:lab}
    <<: *default-restart
    environment:
      # Consumed by the ${ENV:default} placeholders in application.properties.
      JDBC_DRIVER_CLASS_NAME: ${JDBC_DRIVER_CLASS_NAME:-com.mysql.cj.jdbc.Driver}
      JDBC_URL: "${JDBC_URL:-jdbc:mysql://db:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull}"
      JDBC_USERNAME: ${JDBC_USERNAME:-admin}
      JDBC_PASSWORD: ${JDBC_PASSWORD:-admin123}
      MEMCACHED_HOST: ${MEMCACHED_HOST:-cache}
      MEMCACHED_PORT: ${MEMCACHED_PORT:-11211}
      MEMCACHED_STANDBY_HOST: ${MEMCACHED_STANDBY_HOST:-cache}
      MEMCACHED_STANDBY_PORT: ${MEMCACHED_STANDBY_PORT:-11211}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-test}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-test}
      # Not deployed, but the keys must resolve (Components.java @Value has no defaults).
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-localhost}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_CLUSTER: ${ELASTICSEARCH_CLUSTER:-vprofile}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE:-vprofilenode}
      # logback.xml defaults everything to OFF; raise it so the lab is debuggable.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SPRING_LOG_LEVEL: ${SPRING_LOG_LEVEL:-INFO}
      HIBERNATE_LOG_LEVEL: ${HIBERNATE_LOG_LEVEL:-WARN}
      # Bounded startup wait, in addition to depends_on -- the app must not rely on the
      # orchestrator alone, because a failed Hibernate bootstrap is not retried.
      WAIT_FOR_TCP: ${WAIT_FOR_TCP:-db:3306 rabbitmq:5672 cache:11211}
      WAIT_FOR_TIMEOUT: ${WAIT_FOR_TIMEOUT:-90}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      vprofile-net:
        aliases:
          - app01
    # Tomcat 8080 is deliberately NOT published; nginx is the entry point. To reach Tomcat
    # directly for debugging: docker compose run --rm --publish 8080:8080 app
    expose:
      - "8080"
    # HEALTHCHECK is defined in the Dockerfile (GET / -> login page).
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  # ---------------------------------------------------------------------------
  # MySQL 8 -- initialised from the repository's own db_backup.sql, unmodified.
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0.43
    <<: *default-restart
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin123}
      # db_backup.sql contains no CREATE DATABASE and no USE statement. The MySQL entrypoint
      # creates this schema and then pipes every /docker-entrypoint-initdb.d/*.sql file through
      # `mysql --database="$MYSQL_DATABASE"`, which supplies the missing USE. No transformation
      # or wrapper script is needed, and the source SQL stays untouched.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-accounts}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin123}
    volumes:
      - vprofile-db-data:/var/lib/mysql
      # Read-only so the container can never modify the repository's dump.
      - ./src/main/resources/db_backup.sql:/docker-entrypoint-initdb.d/01-db_backup.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, so this only passes once the real (networked) server is up.
      # During initialisation MySQL runs socket-only, which correctly reports as unhealthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      vprofile-net:
        aliases:
          - db01
    # Port 3306 is not published. Use: docker compose exec db mysql -uadmin -p accounts
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  # ---------------------------------------------------------------------------
  # Memcached -- used lazily by UserController GET /users/{id}.
  # ---------------------------------------------------------------------------
  cache:
    image: memcached:1.6-alpine
    <<: *default-restart
    command: ["memcached", "-m", "64", "-l", "0.0.0.0", "-p", "11211", "-v"]
    healthcheck:
      test: ["CMD-SHELL", "echo version | timeout 2 nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      vprofile-net:
        aliases:
          - mc01
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  # ---------------------------------------------------------------------------
  # RabbitMQ -- a real startup dependency: appconfig-rabbitmq.xml declares
  # <rabbit:annotation-driven/> + <rabbit:admin/> and ConsumerServiceImpl carries a
  # @RabbitListener, so a listener container dials this service during context refresh.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *default-restart
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-test}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-test}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks:
      vprofile-net:
        aliases:
          - rmq01
    ports:
      # Management UI only, for lab inspection. AMQP 5672 stays internal.
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ---------------------------------------------------------------------------
  # Nginx -- the public entry point, mirroring vagrant/*/nginx.sh.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    <<: *default-restart
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vprofile-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

networks:
  vprofile-net:
    name: vprofile-net
    driver: bridge

volumes:
  vprofile-db-data:
    name: vprofile-db-data
