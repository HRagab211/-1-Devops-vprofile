# vprofile reverse proxy.
#
# Mirrors the repository's own vagrant/*/nginx.sh (listen 80 -> upstream app01:8080), but
# targets the Compose service name instead of a VM hostname.
#
# Context path: the application deploys as ROOT.war and every JSP builds links from
# ${pageContext.request.contextPath}, which evaluates to "" at the root context. A plain
# / -> / proxy is therefore the correct mapping; no rewrite or prefix stripping is needed.

upstream vproapp {
    # "app" is the Compose service name; Docker's embedded DNS resolves it.
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # The app has a file-upload controller; keep a sane ceiling rather than nginx's 1m default.
    client_max_body_size 16m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Lightweight health endpoint for the container HEALTHCHECK. Terminates in nginx and
    # never touches the upstream, so it reports nginx's own liveness.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://vproapp;

        # Keepalive to the upstream requires HTTP/1.1 and an empty Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forwarding headers so Tomcat and the application see the original request.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Do not silently serve a stale/failed upstream response as success.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_redirect off;
    }
}
